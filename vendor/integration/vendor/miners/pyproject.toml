[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miners"
version = "0.5.0"
description = "Auditable hybrid retrieval, PICO screening, full-text adjudication, and risk-of-bias routing."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "MINERS contributors"},
]
dependencies = [
  "cryptography>=3.1",
  "numpy>=1.26.0",
  "openai>=1.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "pypdf>=4.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
retrieval = [
  "joblib>=1.3.0",
  "scikit-learn>=1.4.0",
  "scipy>=1.11.0",
]
dense = [
  "sentence-transformers>=3.0.0",
  "torch>=2.2.0",
]
all = [
  "joblib>=1.3.0",
  "scikit-learn>=1.4.0",
  "scipy>=1.11.0",
  "sentence-transformers>=3.0.0",
  "torch>=2.2.0",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
miners = "miners.cli:main"

[tool.setuptools.packages.find]
include = ["miners*"]
