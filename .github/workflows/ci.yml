name: Offline source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt -c constraints-tested.txt
      - run: python scripts/check_repository.py --tracked
      - run: python scripts/test_portable.py
      - run: PYTHONPATH=vendor/integration python -m unittest discover -s vendor/integration/tests -v
  statistics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: r-lib/actions/setup-r@v2
      - run: pip install -r requirements.txt -c constraints-tested.txt
      - run: Rscript --vanilla -e 'install.packages(c("metafor", "jsonlite"), repos="https://cloud.r-project.org")'
      - run: python -m unittest discover -s tests -p 'test_statistical_*.py' -v
